<title>QAP Review Queue</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F0F2EE; --raise:#F7F8F5; --sunk:#E8EBE5; --ink:#1A1D19; --muted:#5E665C; --faint:#868D83;
  --rule:#D5DAD1; --rule-soft:#E3E7E0;
  --accent:#2F5D50; --accent-soft:#E0E9E4;
  --oxide:#9B3D2E; --oxide-soft:#F1E2DE;
  --amber:#8A6414; --amber-soft:#F2E9D4;
  --sans:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Spectral",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14170F; --raise:#1C201A; --sunk:#101309; --ink:#E7EBE2; --muted:#9BA394; --faint:#79806F;
  --rule:#31372C; --rule-soft:#262B21;
  --accent:#7FB8A2; --accent-soft:#1E2C26;
  --oxide:#D98A76; --oxide-soft:#33211C;
  --amber:#D6B063; --amber-soft:#2C2515;
}}
:root[data-theme="dark"]{
  --paper:#14170F; --raise:#1C201A; --sunk:#101309; --ink:#E7EBE2; --muted:#9BA394; --faint:#79806F;
  --rule:#31372C; --rule-soft:#262B21;
  --accent:#7FB8A2; --accent-soft:#1E2C26;
  --oxide:#D98A76; --oxide-soft:#33211C;
  --amber:#D6B063; --amber-soft:#2C2515;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{border-bottom:1px solid var(--rule);background:var(--raise)}
.bar{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:16px;
     display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.bar h1{font-family:var(--serif);font-size:23px;font-weight:600}
.bar .sub{color:var(--muted);font-size:13.5px;flex:1 1 280px}
.prog{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}

.shell{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:18px;
       display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
@media (max-width:860px){.shell{grid-template-columns:1fr}}

/* queue */
.queue{border:1px solid var(--rule);border-radius:4px;background:var(--raise);overflow:hidden;
       position:sticky;top:14px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
@media (max-width:860px){.queue{position:static;max-height:420px}}
.qhead{padding:11px 13px;border-bottom:1px solid var(--rule);display:flex;gap:7px;flex-wrap:wrap}
.qhead select,.qhead input{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:3px;padding:6px 9px;width:100%}
.qlist{overflow-y:auto;flex:1}
.qi{display:block;width:100%;text-align:left;font:inherit;background:none;cursor:pointer;
    border:0;border-bottom:1px solid var(--rule-soft);padding:9px 13px;color:var(--ink)}
.qi:hover{background:var(--accent-soft)}
.qi[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.qi .l1{display:flex;gap:9px;align-items:baseline}
.qi .code{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:600}
.qi .t{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi.done .t{color:var(--faint);font-weight:400;text-decoration:line-through}
.qi .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.flag{background:var(--amber)} .dot.ok{background:transparent;border:1px solid var(--rule)}
.dot.seen{background:var(--accent)}

/* detail */
.card{border:1px solid var(--rule);border-radius:4px;background:var(--raise);padding:20px 22px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--faint);margin-bottom:9px}
.card h2{font-family:var(--serif);font-size:clamp(20px,3vw,27px);font-weight:600;line-height:1.2}
.facts{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.f{font-size:12px;padding:3px 9px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);background:var(--paper)}
.f b{color:var(--ink);font-family:var(--mono)}
.f.big b{font-size:15px}
.f.neg b{color:var(--oxide)}
.sec{margin-top:20px}
.sec h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:8px}
blockquote{margin:0;padding:12px 15px;background:var(--sunk);border-left:3px solid var(--accent);
  border-radius:0 3px 3px 0;font-family:var(--serif);font-size:16px;line-height:1.5}
.note{color:var(--muted);font-size:14px;max-width:80ch}
.flagbox{border:1px solid var(--rule);border-left:3px solid var(--amber);background:var(--amber-soft);
  padding:11px 14px;border-radius:3px;font-size:13.5px}
.tiers{border:1px solid var(--rule-soft);border-radius:3px;overflow:hidden}
.tier{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;font-size:13.5px;border-top:1px solid var(--rule-soft)}
.tier:first-child{border-top:0}
.tier b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.srcbtn{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;
  border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);
  padding:8px 14px;border-radius:3px}
.srcbtn:hover{background:var(--accent);color:var(--paper)}
.nosrc{font-size:13px;color:var(--faint)}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.acts button{font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:8px 14px;
  border-radius:3px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts .kb{margin-left:auto;align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.intro{border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:13px 16px;border-radius:3px;font-size:13.5px;margin-bottom:16px}
.intro b{font-weight:700}
footer{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:24px 40px;
  color:var(--faint);font-size:12.5px;border-top:1px solid var(--rule);margin-top:30px}
footer p{margin:0 0 6px;max-width:78ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="bar">
    <h1>QAP Review Queue</h1>
    <span class="sub">Check each extracted criterion against the page of the source document it cites.</span>
    <span class="prog" id="prog"></span>
  </div>
</header>

<main class="shell">
  <aside class="queue">
    <div class="qhead">
      <select id="filter" aria-label="Which criteria to review">
        <option value="flag">Needs attention</option>
        <option value="mismatch">States whose totals disagree</option>
        <option value="all">Everything</option>
      </select>
      <input type="search" id="q" placeholder="Filter by state or heading…" aria-label="Filter the queue">
    </div>
    <div class="qlist" id="qlist"></div>
  </aside>
  <section id="detail"></section>
</main>

<footer>
  <p><b>Read-only.</b> Nothing you do here is saved anywhere shared — "mark reviewed" only ticks
     the item off in this browser, so you can keep your place. Send findings back to whoever shared
     this with you.</p>
  <p id="gen"></p>
</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const FLAG = /(reviewer should|should confirm|a reviewer|confirm against|CONTRADICTION|not verified|unclear|worth checking|ambiguous|cannot confirm)/i;

let ITEMS = [], VIEW = [], cur = 0, seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('qap-reviewed') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('qap-reviewed', JSON.stringify([...seen])); } catch (e) {} };
const key = it => `${it.state}|${it.c.n || it.c.h}`;

fetch('qap-data.json').then(r => r.json()).then(d => {
  for (const st of d.states) {
    if (!st.criteria.length) continue;
    // A state's totals disagree when any track states one we cannot reproduce.
    let mismatch = false;
    for (const t of st.tracks) {
      const got = st.computed[String(t.track)] ?? 0;
      if (t.stated_total != null && Math.abs(got - t.stated_total) > 0.01) mismatch = true;
    }
    const doc = st.docs[0] || {};
    for (const c of st.criteria) {
      ITEMS.push({state: st.code, name: st.name, c, doc, mismatch,
                  flag: !!(c.note && FLAG.test(c.note))});
    }
  }
  $('#gen').textContent = `${ITEMS.length} criteria from ${new Set(ITEMS.map(i => i.state)).size} states · snapshot of ${d.generated}`;
  $('#filter').addEventListener('change', build);
  $('#q').addEventListener('input', build);
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,select,textarea')) return;
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); go(cur - 1); }
    if (e.key === 'm') { e.preventDefault(); mark(); }
  });
  build();
}).catch(e => { $('#detail').innerHTML = `<div class="card">Could not load the data: ${esc(e.message)}</div>`; });

function build() {
  const mode = $('#filter').value, term = $('#q').value.trim().toLowerCase();
  VIEW = ITEMS.filter(it => {
    if (mode === 'flag' && !it.flag) return false;
    if (mode === 'mismatch' && !it.mismatch) return false;
    if (!term) return true;
    return it.state.toLowerCase() === term || it.name.toLowerCase().includes(term) ||
           (it.c.h || '').toLowerCase().includes(term);
  });
  if (cur >= VIEW.length) cur = 0;
  $('#qlist').innerHTML = VIEW.map((it, i) => `
    <button class="qi ${seen.has(key(it)) ? 'done' : ''}" data-i="${i}" aria-current="${i === cur}">
      <span class="l1">
        <span class="dot ${seen.has(key(it)) ? 'seen' : it.flag ? 'flag' : 'ok'}"></span>
        <span class="code">${it.state}</span>
        <span class="t">${esc(it.c.h)}</span>
      </span>
    </button>`).join('') || '<div style="padding:16px;color:var(--faint);font-size:13.5px">Nothing matches.</div>';
  $('#qlist').querySelectorAll('.qi').forEach(b =>
    b.addEventListener('click', () => go(+b.dataset.i)));
  const done = VIEW.filter(it => seen.has(key(it))).length;
  $('#prog').textContent = `${done} / ${VIEW.length} reviewed in this list`;
  detail();
}

function go(i) {
  if (!VIEW.length) return;
  cur = Math.max(0, Math.min(VIEW.length - 1, i));
  $('#qlist').querySelectorAll('.qi').forEach((b, j) => b.setAttribute('aria-current', j === cur));
  const el = $('#qlist').children[cur];
  if (el && el.scrollIntoView) el.scrollIntoView({block: 'nearest'});
  detail();
}

function mark() {
  const it = VIEW[cur]; if (!it) return;
  const k = key(it);
  seen.has(k) ? seen.delete(k) : seen.add(k);
  save(); build(); go(cur);
}

function detail() {
  const it = VIEW[cur];
  if (!it) { $('#detail').innerHTML = '<div class="card">Nothing selected.</div>'; return; }
  const c = it.c, d = it.doc;
  const unit = c.unit && c.unit !== 'points' ? c.unit : 'points';
  const pageTxt = c.p0 ? `p.${c.p0}${c.p1 && c.p1 !== c.p0 ? '–' + c.p1 : ''}` : 'no page recorded';
  $('#detail').innerHTML = `
    ${cur === 0 ? `<div class="intro"><b>How to use this.</b> Open the source document, go to the page
      named under “Where it came from”, and check that the quoted words are there and that the
      points and conditions match what the criterion says. Press <b>j</b> and <b>k</b> to move,
      <b>m</b> to tick an item off.</div>` : ''}
    <div class="card">
      <div class="crumb">${it.state} · ${esc(it.name)}${c.n ? ' · ' + esc(c.n) : ''}${c.track ? ' · track: ' + esc(c.track) : ''}</div>
      <h2>${esc(c.h)}</h2>
      <div class="facts">
        ${c.pts != null ? `<span class="f big ${c.neg ? 'neg' : ''}">${c.neg ? 'deduction ' : ''}<b>${c.pts}</b> ${esc(unit)}</span>` : `<span class="f">${esc(c.kind)}</span>`}
        ${c.pt ? `<span class="f">${esc(c.pt)}</span>` : ''}
        ${c.tm ? `<span class="f">${esc(c.tm)} tiers</span>` : ''}
        ${c.cat ? `<span class="f">${esc(c.cat)}</span>` : ''}
        ${it.mismatch ? `<span class="f" style="border-color:var(--oxide);color:var(--oxide)">state total disagrees</span>` : ''}
      </div>

      ${c.note && FLAG.test(c.note) ? `<div class="sec"><div class="flagbox">
          <b>Flagged for you.</b> ${esc(c.note)}</div></div>` : ''}

      <div class="sec">
        <h3>Quoted from the document</h3>
        <blockquote>${esc(c.q)}</blockquote>
      </div>

      <div class="sec">
        <h3>Where it came from</h3>
        <p class="note" style="margin:0 0 11px">
          <span class="mono">${esc(d.file || 'unknown file')}</span>,
          <b>${pageTxt}</b>${c.cell_ref ? `, cell <span class="mono">${esc(c.cell_ref)}</span>` : ''}.
          Page numbers are PDF page indices, which may differ from the printed number.</p>
        ${d.url ? `<a class="srcbtn" href="${esc(d.url)}" target="_blank" rel="noopener">Open the source document ↗</a>`
                : `<span class="nosrc">No public URL is recorded for this document.</span>`}
      </div>

      ${c.t ? `<div class="sec"><h3>Tiers as extracted</h3><div class="tiers">${
        c.t.map(t => `<div class="tier"><span>${esc(t.l ?? '')}</span><b>${t.p}</b></div>`).join('')}</div></div>` : ''}

      ${c.ext ? `<div class="sec"><h3>Test defined elsewhere</h3>
        <p class="note" style="margin:0">${esc(c.ext)} — the document sets the weight but not the test,
        so this cannot be checked against the QAP alone.</p></div>` : ''}

      ${c.note && !FLAG.test(c.note) ? `<div class="sec"><h3>Extraction note</h3>
        <p class="note" style="margin:0">${esc(c.note)}</p></div>` : ''}

      <div class="acts">
        <button id="prev">← Previous</button>
        <button id="markb">${seen.has(key(it)) ? 'Undo reviewed' : 'Mark reviewed'}</button>
        <button id="next">Next →</button>
        <span class="kb">j / k move · m marks</span>
      </div>
    </div>`;
  $('#prev').addEventListener('click', () => go(cur - 1));
  $('#next').addEventListener('click', () => go(cur + 1));
  $('#markb').addEventListener('click', mark);
}
</script>
