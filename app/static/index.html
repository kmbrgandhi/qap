<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAP criteria — review &amp; search</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e3e0da;
    --accent:#2f5d50; --accent-soft:#e8f0ed; --warn:#a4551b; --warn-soft:#fbf0e6;
    --bad:#9b2c2c; --bad-soft:#fbeaea; --ok:#2f6b3f; --shadow:0 1px 3px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#15171a; --panel:#1c1f23; --ink:#e9e6e1; --muted:#9a9a96; --line:#2e3237;
    --accent:#7fb8a4; --accent-soft:#1f2b28; --warn:#d99b60; --warn-soft:#2b2318;
    --bad:#e08585; --bad-soft:#2c1c1c; --ok:#7fb88c; --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:20px;padding:12px 20px;
         border-bottom:1px solid var(--line);background:var(--panel);
         position:sticky;top:0;z-index:10;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  nav{display:flex;gap:4px}
  nav button{background:none;border:1px solid transparent;color:var(--muted);
    padding:5px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px}
  nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav button:hover:not(.on){border-color:var(--line)}
  .who{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .who input{width:110px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
  main{padding:18px 20px;max-width:1500px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     margin:0 0 12px;font-weight:650}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;
     text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:var(--accent-soft)}
  .scroll{overflow-x:auto}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
    font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}
  .tag.bad{background:var(--bad-soft);color:var(--bad)}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  input[type=search],select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
  input[type=search]{min-width:260px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  /* review split */
  .split{display:grid;grid-template-columns:minmax(340px,1fr) minmax(420px,1.25fr);gap:16px}
  @media(max-width:1000px){.split{grid-template-columns:1fr}}
  .pageimg{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .actions button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;font-size:13.5px;font-weight:550}
  .actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .actions button.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  kbd{font:600 11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;color:var(--muted)}
  .quote{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 12px;
    border-radius:0 6px 6px 0;font-size:13.5px;margin:10px 0}
  .note{background:var(--bg);border:1px dashed var(--line);border-radius:7px;
    padding:9px 12px;font-size:13px;margin:10px 0}
  .bar{height:9px;border-radius:5px;background:var(--accent);display:inline-block;vertical-align:middle}
  .barwrap{display:flex;align-items:center;gap:8px}
  dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:13.5px}
  dl.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
  dl.kv dd{margin:0}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .progress{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
  .progress > i{display:block;height:100%;background:var(--accent)}
  .banner{padding:10px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>QAP criteria</h1>
  <nav>
    <button data-v="review" class="on">Review</button>
    <button data-v="search">Search</button>
    <button data-v="overview">Corpus</button>
    <button data-v="conflicts">Disagreements</button>
  </nav>
  <div class="who">reviewer <input id="who" placeholder="your name"></div>
</header>
<main>
  <section id="review"></section>
  <section id="search" hidden></section>
  <section id="overview" hidden></section>
  <section id="conflicts" hidden></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = (u) => fetch(u).then(r => r.json());
const fmt = v => v === null || v === undefined ? "—" : (+v % 1 ? (+v).toFixed(2) : String(+v));

let VIEW = "review", QUEUE = [], IDX = 0, CUR = null;
const who = () => $("#who").value.trim();
$("#who").value = localStorage.getItem("qap_reviewer") || "";
$("#who").addEventListener("input", e => localStorage.setItem("qap_reviewer", e.target.value));

document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.v)));

function show(v){
  VIEW = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  ["review","search","overview","conflicts"].forEach(s => $("#"+s).hidden = s !== v);
  ({review:loadQueue, search:renderSearch, overview:renderOverview, conflicts:renderConflicts})[v]();
}

/* ---------------------------------------------------------------- REVIEW */
async function loadQueue(){
  QUEUE = await get("/api/criteria?limit=1000");
  if(!QUEUE.length){ $("#review").innerHTML = '<div class="panel empty">Nothing loaded yet.</div>'; return; }
  IDX = Math.min(IDX, QUEUE.length - 1);
  renderCard();
}

async function renderCard(){
  const row = QUEUE[IDX];
  CUR = await get("/api/criterion/" + row.id);
  const done = QUEUE.filter(q => q.n_reviews > 0).length;
  const tiers = CUR.tiers.length ? `
    <h2 style="margin-top:16px">Tiers <span class="muted" style="text-transform:none;letter-spacing:0">
      — sum ${fmt(CUR.tiers.reduce((a,t)=>a+(t.points||0),0))}, capped at ${fmt(CUR.points_max)}</span></h2>
    <table><thead><tr><th>Condition</th><th class="num">Pts</th></tr></thead><tbody>
    ${CUR.tiers.map(t=>`<tr><td>${esc(t.tier_label)}</td><td class="num">${fmt(t.points)}</td></tr>`).join("")}
    </tbody></table>` : "";

  $("#review").innerHTML = `
  <div class="progress"><i style="width:${(done/QUEUE.length*100).toFixed(1)}%"></i></div>
  <div class="muted" style="font-size:12.5px;margin-bottom:12px">
    ${IDX+1} of ${QUEUE.length} &nbsp;·&nbsp; ${done} reviewed
    &nbsp;·&nbsp; <kbd>A</kbd> accept <kbd>E</kbd> edit <kbd>R</kbd> reject
    <kbd>J</kbd>/<kbd>K</kbd> move
  </div>
  ${CUR.citation_verified ? "" :
    '<div class="banner warn">⚠ This quote was not found on the cited page. The highlight below will be missing — treat the page reference as unverified.</div>'}
  <div class="split">
    <div class="panel">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <span class="tag">${esc(CUR.state)} ${CUR.cycle_start||""}</span>
        <span class="tag ${CUR.kind==="competitive"?"":"warn"}">${esc(CUR.kind)}</span>
        ${CUR.track?`<span class="tag">${esc(CUR.track)}</span>`:""}
        ${CUR.citation_verified?'<span class="tag" style="background:var(--accent-soft)">✓ cited</span>'
                               :'<span class="tag bad">unverified</span>'}
      </div>
      <div style="font-size:17px;font-weight:600;line-height:1.35">${esc(CUR.heading)}</div>
      <dl class="kv" style="margin-top:12px">
        <dt>Section</dt><dd class="mono">${esc(CUR.section_label)||"—"}</dd>
        <dt>Category</dt><dd>${esc(CUR.native_category)||"—"}</dd>
        <dt>Max</dt><dd><b>${fmt(CUR.points_max)}</b> ${esc(CUR.scoring_unit)}
            <span class="muted">(${esc(CUR.points_type)})</span></dd>
        <dt>Page</dt><dd>${CUR.page_start||"—"}${CUR.page_end&&CUR.page_end!==CUR.page_start?"–"+CUR.page_end:""}
            of ${CUR.n_pages}</dd>
      </dl>
      <div class="quote">“${esc(CUR.quote)}”</div>
      ${CUR.note?`<div class="note"><b>Extraction note</b><br>${esc(CUR.note)}</div>`:""}
      ${tiers}
      <div class="actions">
        <button class="primary" onclick="review('accepted')">Accept</button>
        <button onclick="review('edited')">Needs edit</button>
        <button class="danger" onclick="review('rejected')">Reject</button>
        <button onclick="review('skipped')">Skip</button>
        <a href="/api/pdf?cid=${CUR.id}" target="_blank"
           style="margin-left:auto;align-self:center;color:var(--muted);font-size:13px">open PDF ↗</a>
      </div>
      <div id="saved" class="muted" style="font-size:12.5px;margin-top:8px"></div>
    </div>
    <div class="panel">
      <h2>Source page ${CUR.page_start||""} — quote highlighted</h2>
      <img class="pageimg" src="/api/page.png?cid=${CUR.id}" alt="cited page">
    </div>
  </div>`;
}

async function review(status){
  if(!who()){ $("#saved").textContent = "Enter your name first (top right)."; return; }
  let note = null;
  if(status === "edited" || status === "rejected")
    note = prompt(status === "edited" ? "What needs changing?" : "Why reject?") || null;
  await fetch("/api/review", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({criterion_id: CUR.id, reviewer: who(), status, note})});
  const q = QUEUE.find(x => x.id === CUR.id); if(q) q.n_reviews = (q.n_reviews||0)+1;
  if(IDX < QUEUE.length-1){ IDX++; renderCard(); }
  else { $("#saved").textContent = "Saved — end of queue."; }
}

document.addEventListener("keydown", e => {
  if(VIEW !== "review" || /input|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if(k === "a") review("accepted");
  else if(k === "e") review("edited");
  else if(k === "r") review("rejected");
  else if(k === "j" && IDX < QUEUE.length-1){ IDX++; renderCard(); }
  else if(k === "k" && IDX > 0){ IDX--; renderCard(); }
});

/* ---------------------------------------------------------------- SEARCH */
async function renderSearch(){
  if(!$("#searchbox")){
    $("#search").innerHTML = `
      <div class="filters">
        <input type="search" id="searchbox" placeholder="search headings, quotes, categories…">
        <select id="fstate"><option value="">all states</option></select>
        <select id="fkind"><option value="">all kinds</option>
          <option>competitive</option><option>threshold</option>
          <option>ranked_priority</option><option>tiebreaker</option><option>set_aside</option></select>
        <select id="funit"><option value="">all units</option>
          <option>points</option><option>checkmarks</option><option>none</option></select>
        <label class="muted" style="font-size:13px">
          <input type="checkbox" id="funver"> unverified only</label>
      </div>
      <div id="results"></div>`;
    const ov = await get("/api/overview");
    const states = [...new Set(ov.docs.map(d => d.state).filter(Boolean))].sort();
    $("#fstate").innerHTML += states.map(s=>`<option>${s}</option>`).join("");
    ["searchbox","fstate","fkind","funit","funver"].forEach(id =>
      $("#"+id).addEventListener("input", runSearch));
  }
  runSearch();
}

let searchTimer;
function runSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const p = new URLSearchParams({
      q: $("#searchbox").value, state: $("#fstate").value,
      kind: $("#fkind").value, unit: $("#funit").value,
      unverified_only: $("#funver").checked, limit: 500});
    const data = await get("/api/criteria?" + p);
    const maxPts = Math.max(1, ...data.map(d => d.points_max || 0));
    $("#results").innerHTML = !data.length
      ? '<div class="panel empty">No criteria match.</div>'
      : `<div class="panel"><h2>${data.length} criteria</h2><div class="scroll"><table>
        <thead><tr><th>State</th><th>Criterion</th><th>Category</th><th>Kind</th>
        <th class="num">Max</th><th>Scale</th><th class="num">Pg</th><th>Cite</th></tr></thead><tbody>
        ${data.map(d => `<tr>
          <td><span class="tag">${esc(d.state)}</span></td>
          <td><div style="font-weight:550">${esc(d.heading)}</div>
              <div class="muted mono" style="font-size:11.5px">${esc(d.section_label)||""}</div></td>
          <td class="muted">${esc(d.native_category)||"—"}</td>
          <td>${d.kind==="competitive"?'<span class="muted">—</span>'
                :`<span class="tag warn">${esc(d.kind)}</span>`}</td>
          <td class="num"><b>${fmt(d.points_max)}</b>
              <span class="muted" style="font-size:11px">${d.points_max!==null?esc(d.scoring_unit):""}</span></td>
          <td><div class="barwrap"><span class="bar"
              style="width:${((d.points_max||0)/maxPts*70).toFixed(1)}px"></span></div></td>
          <td class="num">${d.page_start||"—"}</td>
          <td>${d.citation_verified?'<span style="color:var(--ok)">✓</span>'
                                   :'<span class="tag bad">✗</span>'}</td>
        </tr>`).join("")}</tbody></table></div></div>`;
  }, 140);
}

/* -------------------------------------------------------------- OVERVIEW */
async function renderOverview(){
  const ov = await get("/api/overview");
  const maxPts = Math.max(1, ...ov.categories.map(c => c.pts || 0));
  const byState = {};
  ov.categories.forEach(c => (byState[c.state] ||= []).push(c));

  $("#overview").innerHTML = `
  <div class="panel"><h2>Documents</h2><div class="scroll"><table>
    <thead><tr><th>State</th><th>Cycle</th><th>Cycle source</th><th>Status</th>
      <th class="num">Pages</th><th>Text</th><th class="num">Criteria</th><th>Flags</th></tr></thead><tbody>
    ${ov.docs.map(d=>`<tr>
      <td><span class="tag">${esc(d.state)||"??"}</span></td>
      <td>${d.cycle_start?esc(d.cycle_start)+(d.cycle_end!==d.cycle_start?"–"+esc(d.cycle_end):""):"—"}</td>
      <td class="muted mono" style="font-size:11.5px">${esc(d.cycle_source)||"—"}</td>
      <td>${d.doc_status==="draft"?'<span class="tag warn">draft</span>':esc(d.doc_status)}
          ${d.is_most_recent?'<span class="tag">most recent</span>':""}</td>
      <td class="num">${d.n_pages}</td>
      <td>${d.source_quality==="native"?'<span class="muted">native</span>'
            :`<span class="tag bad">${esc(d.source_quality)}</span>`}</td>
      <td class="num">${d.n_criteria||'<span class="muted">0</span>'}</td>
      <td>${d.n_unverified?`<span class="tag bad">${d.n_unverified} unverified</span>`:""}</td>
    </tr>`).join("")}</tbody></table></div></div>

  <div class="panel"><h2>Totals reconciliation</h2>
    <p class="muted" style="font-size:13px;margin:-4px 0 12px">
      <b>Computed</b> honours exclusivity (tier caps, pick-one menus).
      <b>Flat sum</b> is what adding every stated point value would give.
      The gap is double-counting avoided.</p>
    <div class="scroll"><table>
    <thead><tr><th>State</th><th>Track</th><th>Unit</th><th class="num">Stated</th>
      <th class="num">Computed</th><th class="num">Flat sum</th>
      <th class="num">Double-counted</th><th></th></tr></thead><tbody>
    ${ov.totals.map(t=>`<tr>
      <td><span class="tag">${esc(t.state)}</span></td>
      <td class="muted">${esc(t.track)||"—"}</td><td class="muted">${esc(t.scoring_unit)}</td>
      <td class="num">${fmt(t.stated_total)}</td>
      <td class="num"><b>${fmt(t.computed_total)}</b></td>
      <td class="num muted">${fmt(t.naive_total)}</td>
      <td class="num" style="color:var(--warn);font-weight:600">
        ${t.double_counted>0?"+"+fmt(t.double_counted):"—"}</td>
      <td>${t.status==="OK"?'<span class="tag" style="color:var(--ok)">✓ reconciles</span>'
            :`<span class="tag ${t.status==="MISMATCH"?"bad":"warn"}">${esc(t.status)}</span>`}</td>
    </tr>`).join("")}</tbody></table></div></div>

  ${Object.entries(byState).map(([st,cs])=>`
  <div class="panel"><h2>${esc(st)} — points by the QAP's own category</h2>
    <table><tbody>${cs.map(c=>`<tr>
      <td style="width:46%">${esc(c.native_category)||"—"}</td>
      <td><div class="barwrap"><span class="bar" style="width:${((c.pts||0)/maxPts*300).toFixed(0)}px"></span>
        <b>${fmt(c.pts)}</b> <span class="muted" style="font-size:12px">${esc(c.scoring_unit)}
        · ${c.n} criteria</span></div></td></tr>`).join("")}</tbody></table></div>`).join("")}

  <div class="panel"><h2>Criterion kinds</h2><div class="scroll"><table>
    <thead><tr><th>State</th><th>Kind</th><th class="num">Count</th></tr></thead><tbody>
    ${ov.kinds.map(k=>`<tr><td><span class="tag">${esc(k.state)}</span></td>
      <td>${esc(k.kind)}</td><td class="num">${k.n}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

/* ------------------------------------------------------------- CONFLICTS */
async function renderConflicts(){
  const d = await get("/api/disagreements");
  $("#conflicts").innerHTML = !d.length
    ? `<div class="panel empty">No disagreements yet.<br>
       <span style="font-size:13px">Appears once two reviewers code the same criterion differently.</span></div>`
    : d.map(c=>`<div class="panel">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <span class="tag">${esc(c.state)}</span>
          <b>${esc(c.heading)}</b>
          <span class="muted" style="font-size:12.5px">p${c.page_start}</span>
          <span class="tag bad" style="margin-left:auto">
            contested: ${c.contested_fields.map(esc).join(", ")}</span>
        </div>
        <table><thead><tr><th>Reviewer</th><th>Status</th><th>Note</th></tr></thead><tbody>
        ${c.reviews.map(r=>`<tr><td><b>${esc(r.reviewer)}</b></td>
          <td>${esc(r.status)}</td><td class="muted">${esc(r.note)||"—"}</td></tr>`).join("")}
        </tbody></table></div>`).join("");
}

show("review");
</script>
</body>
</html>
